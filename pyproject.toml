[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "birdnet-pi"
version = "1.0.0"
description = "Bird sound identification system for Raspberry Pi"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy",
    "librosa",
    "pytz",
    "tzlocal",
    "requests",
    "pillow",
    "soundfile",
    "inotify",
    "apprise>=1.9.0",
    "paho-mqtt!=2.0",
]

[project.optional-dependencies]
# Full install including visualization and web dashboard
full = [
    "tensorflow",
    "pandas",
    "seaborn",
    "matplotlib",
    "streamlit>=1.44.0",
    "plotly",
    "pyarrow>=20.0.0",
    "suntime>=1.3.0",
    "sklearn",
]
# Development and testing
dev = [
    "pytest>=7.1.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/Nachtzuster/BirdNET-Pi"
Repository = "https://github.com/Nachtzuster/BirdNET-Pi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
birdnet = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
